[package]
name = "photocraft-android"
description = "PhotoCraft on Android: GameActivity shell (eframe) - Phase 0 spike stub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "photocraft_android"
crate-type = ["cdylib", "lib"]

# The Android entry point needs `#[unsafe(no_mangle)]`, which the workspace's `forbid` would reject
# even with a local `allow`, so this crate sets its own lints (as crates/tablet does).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[features]
# Open HEIC/HEIF photos, as official desktop builds do.
heif = ["photocraft-codecs/heif"]

[dependencies]
photocraft-codecs = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["wgpu", "android-game-activity"] }
winit = { version = "=0.30.13", default-features = false, features = ["android-game-activity"] }
android_logger = "0.15"
# Already in Cargo.lock (iana-time-zone); reads system properties for the GPU plan.
android_system_properties = "=0.1.6"
jni = "=0.22.4"
